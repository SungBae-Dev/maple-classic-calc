name: Probe price site (one-off)
on:
  push:
    branches: [probe-planet-helper]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/probe.mjs
