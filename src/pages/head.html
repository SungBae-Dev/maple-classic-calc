<!doctype html>
<html lang="{{htmlLang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{pageTitle}}</title>
<meta name="description" content="{{pageDesc}}">
<link rel="canonical" href="{{canonical}}">
{{{hreflang}}}
<meta name="robots" content="index, follow, max-image-preview:large">
{{{verification}}}
<meta name="theme-color" content="#E7EEF5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D151E" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{meta.siteName}}">
<meta property="og:title" content="{{pageTitle}}">
<meta property="og:description" content="{{pageDesc}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{ogImage}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{meta.ogAlt}}">
<meta property="og:locale" content="{{ogLocale}}">
{{{ogLocaleAlt}}}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{pageTitle}}">
<meta name="twitter:description" content="{{pageDesc}}">
<meta name="twitter:image" content="{{ogImage}}">
<link rel="icon" href="{{base}}favicon.svg" type="image/svg+xml">
<link rel="icon" href="{{base}}favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="{{base}}apple-touch-icon.png">
<link rel="manifest" href="{{base}}site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{fontsHref}}">
<link rel="stylesheet" href="{{base}}{{cssPath}}">
<style>:root{--f-display:{{{fontDisplay}}};--w-display:{{fontDisplayWeight}};--f-body:{{{fontBody}}}}</style>
<script type="application/ld+json">{{{jsonld}}}</script>
</head>
